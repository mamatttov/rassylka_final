; Скопируйте этот файл в smtp.ini и заполните.
; Пароль здесь НЕ хранится: задайте переменную окружения BUH_SMTP_PASSWORD
; (или программа спросит его при запуске с --send / --test-to).

[smtp]
host = smtp.gmail.com
; 465 + ssl  или  587 + starttls
port = 465
security = ssl
user = buh@example.com
from_addr = buh@example.com
from_name = Бухгалтерия
reply_to =
; пауза между письмами, сек (почтовые сервисы не любят частую отправку)
delay_seconds = 1.5

[letter]
organization = ООО «Альфа»
; {period} — «октябрь 2026», {fio} — ФИО, {org} — организация, {total} — к выплате
subject = Расчётный листок за {period}
body = Здравствуйте, {fio}!

    Во вложении ваш расчётный листок за {period}.
    Сумма к выплате: {total}.

    Если есть вопросы по начислениям, ответьте на это письмо.

    С уважением,
    бухгалтерия {org}
